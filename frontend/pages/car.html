<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточка автомобиля — MELLDRIVE</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <style>
        .car-detail {
            display: grid;
            grid-template-columns: 1.15fr 1fr;
            gap: 32px;
            align-items: start;
        }
        .car-detail__photo {
            width: 100%;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            object-fit: cover;
            max-height: 420px;
        }
        .panel-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 22px;
            margin-top: 20px;
        }
        .booking-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 26px;
        }
        .tariff-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 14px 0;
        }
        .tariff-pill {
            padding: 11px 8px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--bg-main);
            color: var(--text-main);
            cursor: pointer;
            text-align: center;
            font-weight: 600;
            font-size: 0.86rem;
        }
        .tariff-pill.active {
            border-color: var(--gold);
            background: var(--gold-soft);
            color: var(--gold);
        }
        .extra-list { display: flex; flex-direction: column; gap: 10px; margin: 14px 0; font-size: 0.92rem; }
        .promo-row { display: flex; gap: 8px; margin-top: 12px; }
        .promo-row input {
            flex: 1;
            padding: 9px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-main);
            color: var(--text-main);
        }
        .total-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 0; border-top: 1px solid var(--border); margin-top: 14px;
            font-size: 1.25rem; font-weight: 800;
        }
        .review-item {
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }
        .review-item:last-child { border-bottom: none; }
        .review-form { display: grid; gap: 10px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
        .review-form input, .review-form select, .review-form textarea {
            width: 100%;
            padding: 9px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-main);
            color: var(--text-main);
            font-family: inherit;
        }
        @media (max-width: 860px) {
            .car-detail { grid-template-columns: 1fr; }
        }
    </style>
<style id="force-nav-visible">
  .header, .header .container, .header__container { overflow: visible !important; }
  .header .nav, .header nav {
    display: flex !important;
    visibility: visible !important;
    opacity: 1 !important;
    position: static !important;
    transform: none !important;
    max-height: none !important;
    width: auto !important;
    background: transparent !important;
  }
  .header .nav__list {
    display: flex !important;
    flex-wrap: wrap !important;
    align-items: center !important;
    gap: 16px !important;
  }
  .header .nav__link { display: inline-block !important; white-space: nowrap !important; }
</style>
</head>
<body>
    <header class="header">
        <div class="container header__container">
            <a href="../index.html" class="logo"><span class="logo__highlight">MELL</span>DRIVE</a>
                                                <nav class="nav" id="mainNav" style="display:flex; visibility:visible; opacity:1;">
                <ul class="nav__list" style="display:flex; flex-wrap:wrap; gap:16px; list-style:none; margin:0; padding:0; align-items:center;">
                    <li><a href="../index.html" class="nav__link" style="white-space:nowrap;">Главная</a></li>
                    <li><a href="catalog.html" class="nav__link " style="white-space:nowrap;">Автопарк</a></li>
                    <li><a href="map.html" class="nav__link " style="white-space:nowrap;">Карта зон</a></li>
                    <li><a href="profile.html" class="nav__link " style="white-space:nowrap;">Кабинет</a></li>
                    <li><a href="admin.html" class="nav__link " style="white-space:nowrap;">Админка</a></li>
                    <li><a href="ui-kit.html" class="nav__link " style="white-space:nowrap;">UI-кит</a></li>
                </ul>
            </nav>
            <div class="header__actions">
                <a href="profile.html" class="btn btn--outline btn--sm">Мои брони</a>
            </div>
        </div>
    </header>

    <main class="section">
        <div class="container">
            <div class="car-detail">
                <div>
                    <img id="carPhoto" class="car-detail__photo" src="" alt="Фото автомобиля">

                    <div class="panel-card">
                        <h3 style="margin-bottom: 10px;">Осмотр авто перед поездкой</h3>
                        <p style="color: var(--text-muted); font-size: 0.88rem; margin-bottom: 10px;">Отметьте состояние перед стартом аренды (фиксация для защиты водителя):</p>
                        <div style="display:flex; flex-wrap:wrap; gap:12px; font-size:0.88rem;">
                            <label><input type="checkbox" class="inspection-cb" checked> Кузов без новых повреждений</label>
                            <label><input type="checkbox" class="inspection-cb" checked> Салон чистый, бак > 1/4</label>
                            <label><input type="checkbox" class="inspection-cb"> Есть мелкий скол / царапина</label>
                        </div>
                    </div>

                    <div class="panel-card">
                        <h3 style="margin-bottom: 8px;">Отзывы водителей (<span id="reviewsCount">0</span>)</h3>
                        <div id="reviewsList"></div>

                        <form class="review-form" id="reviewForm">
                            <strong>Оставить отзыв об автомобиле</strong>
                            <div style="display:grid; grid-template-columns: 1.4fr 1fr; gap:10px;">
                                <input type="text" id="revAuthor" required placeholder="Ваше имя (например, Артём)">
                                <select id="revRating">
                                    <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
                                    <option value="4">⭐⭐⭐⭐☆ (4/5)</option>
                                    <option value="3">⭐⭐⭐☆☆ (3/5)</option>
                                    <option value="2">⭐⭐☆☆☆ (2/5)</option>
                                    <option value="1">⭐☆☆☆☆ (1/5)</option>
                                </select>
                            </div>
                            <textarea id="revText" rows="2" required placeholder="Как едет авто, состояние салона, подача..."></textarea>
                            <button type="submit" class="btn btn--outline btn--sm">Опубликовать отзыв</button>
                        </form>
                    </div>
                </div>

                <div class="booking-box">
                    <span class="hero__badge" id="carCategory">Класс</span>
                    <h1 id="carTitle" style="font-size: 2rem; margin-bottom: 10px;">Загрузка...</h1>
                    <p id="carSpecs" style="color: var(--text-muted); margin-bottom: 18px;"></p>

                    <label style="font-size: 0.9rem; color: var(--text-muted);">Выберите формат тарифа:</label>
                    <div class="tariff-options" id="tariffGroup">
                        <button type="button" class="tariff-pill active" data-mode="minute" data-label="Минуты (30 мин)">Минуты (30 мин)</button>
                        <button type="button" class="tariff-pill" data-mode="hour" data-label="Пакет 3 часа">Пакет 3 часа</button>
                        <button type="button" class="tariff-pill" data-mode="day" data-label="Сутки (24 ч)">Сутки (24 ч)</button>
                    </div>

                    <div class="extra-list">
                        <label><input type="checkbox" id="optCasco"> Полное КАСКО без франшизы (+490 ₽)</label>
                        <label><input type="checkbox" id="optChild"> Детское кресло / бустер (+250 ₽)</label>
                    </div>

                    <div class="promo-row">
                        <input type="text" id="promoInput" placeholder="Промокод (MELL10 или START300)">
                        <button type="button" class="btn btn--outline btn--sm" id="applyPromoBtn">Применить</button>
                    </div>
                    <div id="promoStatus" style="font-size:0.82rem; color:var(--gold); margin-top:6px;"></div>

                    <div class="total-bar">
                        <span>Итого к оплате:</span>
                        <span id="totalPrice" style="color: var(--gold);">0 ₽</span>
                    </div>

                    <button type="button" id="confirmBookingBtn" class="btn btn--primary btn--large btn--block">Оформить бронирование</button>
                    <p id="bookingSuccessMsg" class="hidden" style="margin-top: 14px; color: var(--success); font-weight: 600;"></p>
                </div>
            </div>
        </div>
    </main>

    <script>
        const STORAGE_KEY = 'melldrive_cms_v2';
        const BOOKINGS_KEY = 'melldrive_bookings_v1';
        const REVIEWS_KEY = 'melldrive_reviews_v1';

        const DEFAULT_CAR = {
            id: 1,
            name: 'Hyundai Solaris',
            category: 'Эконом',
            specs: 'АКПП • Бензин • Кондиционер',
            priceMin: 11.5,
            priceDay: 2400,
            img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/4/49/2018_Hyundai_Accent_%28Solaris%29_front_3.13.18.jpg/960px-2018_Hyundai_Accent_%28Solaris%29_front_3.13.18.jpg'
        };

        const params = new URLSearchParams(window.location.search);
        const carId = Number(params.get('id')) || 1;
        let car = DEFAULT_CAR;

        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
                const parsed = JSON.parse(raw);
                const found = (parsed.cars || []).find(c => Number(c.id) === carId);
                if (found) car = found;
            }
        } catch (e) {}

        document.getElementById('carPhoto').src = car.img;
        document.getElementById('carPhoto').alt = car.name;
        document.getElementById('carCategory').textContent = car.category;
        document.getElementById('carTitle').textContent = car.name;
        document.getElementById('carSpecs').textContent = car.specs;
        document.title = `${car.name} — Аренда в MELLDRIVE`;

        // Тарифы, опции и промокод
        let mode = 'minute';
        let tariffLabel = 'Минуты (30 мин)';
        let currentTotal = 0;
        let activePromo = '';

        function recalc() {
            let base = 0;
            if (mode === 'minute') base = Number(car.priceMin) * 30;
            if (mode === 'hour') base = Number(car.priceMin) * 140;
            if (mode === 'day') base = Number(car.priceDay);

            if (document.getElementById('optCasco').checked) base += 490;
            if (document.getElementById('optChild').checked) base += 250;

            if (activePromo === 'MELL10') base = base * 0.9;
            if (activePromo === 'START300') base = Math.max(0, base - 300);

            currentTotal = Math.round(base);
            document.getElementById('totalPrice').textContent = `${currentTotal.toLocaleString('ru-RU')} ₽`;
        }

        document.querySelectorAll('.tariff-pill').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tariff-pill').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                mode = btn.dataset.mode;
                tariffLabel = btn.dataset.label;
                recalc();
            });
        });
        document.getElementById('optCasco').addEventListener('change', recalc);
        document.getElementById('optChild').addEventListener('change', recalc);

        document.getElementById('applyPromoBtn').addEventListener('click', () => {
            const code = document.getElementById('promoInput').value.trim().toUpperCase();
            const statusEl = document.getElementById('promoStatus');
            if (code === 'MELL10' || code === 'START300') {
                activePromo = code;
                statusEl.textContent = code === 'MELL10' ? 'Применён промокод MELL10 (−10%)' : 'Применён промокод START300 (−300 ₽)';
            } else {
                activePromo = '';
                statusEl.textContent = code ? 'Промокод не найден (доступны: MELL10, START300)' : '';
            }
            recalc();
        });

        document.getElementById('confirmBookingBtn').addEventListener('click', () => {
            const code = 'MD-' + Math.floor(100000 + Math.random() * 900000);
            const options = [];
            if (document.getElementById('optCasco').checked) options.push('КАСКО');
            if (document.getElementById('optChild').checked) options.push('Детское кресло');
            if (activePromo) options.push(`Промокод ${activePromo}`);

            const booking = {
                id: code,
                carName: car.name,
                category: car.category,
                tariff: tariffLabel,
                options: options.length ? options.join(', ') : 'Без доп. опций',
                total: currentTotal,
                status: 'Активна',
                createdAt: new Date().toLocaleString('ru-RU')
            };

            let list = [];
            try {
                list = JSON.parse(localStorage.getItem(BOOKINGS_KEY) || '[]');
                if (!Array.isArray(list)) list = [];
            } catch (e) { list = []; }
            list.unshift(booking);
            localStorage.setItem(BOOKINGS_KEY, JSON.stringify(list));

            const msg = document.getElementById('bookingSuccessMsg');
            msg.innerHTML = `✅ Бронь <strong>${code}</strong> сохранена! <a href="profile.html" style="color:var(--gold); text-decoration:underline;">Перейти в кабинет →</a>`;
            msg.classList.remove('hidden');
        });

        // Отзывы (с поддержкой редактирования и статуса из админки)
        function loadReviews() {
            try {
                const raw = localStorage.getItem(REVIEWS_KEY);
                if (raw !== null) {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed)) return parsed;
                }
            } catch (e) {}
            const seed = [
                { id: 1, carId: car.id, author: 'Алексей Н.', rating: 5, text: 'Отличное состояние салона, подача заняла 7 минут, полный бак.', status: 'Опубликован', date: '22.11.2026' }
            ];
            localStorage.setItem(REVIEWS_KEY, JSON.stringify(seed));
            return seed;
        }

        function renderReviews() {
            const all = loadReviews();
            const visible = all.filter(r => Number(r.carId) === Number(car.id) && r.status === 'Опубликован');
            document.getElementById('reviewsCount').textContent = visible.length;
            const box = document.getElementById('reviewsList');
            if (!visible.length) {
                box.innerHTML = '<p style="color:var(--text-muted); font-size:0.9rem;">Опубликованных отзывов пока нет. Оставьте первый отзыв ниже.</p>';
                return;
            }
            box.innerHTML = visible.map(r => {
                const stars = '★'.repeat(Number(r.rating) || 5) + '☆'.repeat(Math.max(0, 5 - (Number(r.rating) || 5)));
                return `
                    <div class="review-item">
                        <div style="display:flex; justify-content:space-between; gap:8px;">
                            <strong>${r.author}</strong>
                            <span style="color:var(--gold);">${stars}</span>
                        </div>
                        <p style="margin-top:6px; font-size:0.92rem;">${r.text}</p>
                        <small style="color:var(--text-muted);">${r.date}</small>
                    </div>
                `;
            }).join('');
        }

        document.getElementById('reviewForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const author = document.getElementById('revAuthor').value.trim();
            const rating = Number(document.getElementById('revRating').value) || 5;
            const text = document.getElementById('revText').value.trim();
            if (!author || !text) return;

            const all = loadReviews();
            all.unshift({
                id: Date.now(),
                carId: car.id,
                author,
                rating,
                text,
                status: 'Опубликован',
                date: new Date().toLocaleDateString('ru-RU')
            });
            localStorage.setItem(REVIEWS_KEY, JSON.stringify(all));
            e.target.reset();
            renderReviews();
        });

        recalc();
        renderReviews();
    </script>
</body>
</html>
