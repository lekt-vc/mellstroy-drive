<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Каталог автомобилей MELLDRIVE — фильтры по классу, зонам и ценам.">
    <title>Автопарк — MELLDRIVE</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <style>
        .catalog-toolbar {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 12px;
            margin-bottom: 28px;
        }
        .catalog-toolbar input, .catalog-toolbar select {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 11px 14px;
            border-radius: 10px;
            font-size: 0.95rem;
            width: 100%;
        }
        .breadcrumbs {
            display: flex;
            gap: 8px;
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-bottom: 18px;
            flex-wrap: wrap;
        }
        .breadcrumbs a { color: var(--gold); text-decoration: none; }
        @media (max-width: 768px) {
            .catalog-toolbar { grid-template-columns: 1fr; }
        }
    </style>
<style id="force-nav-visible">
  .header, .header .container, .header__container { overflow: visible !important; }
  .header .nav, .header nav {
    display: flex !important;
    visibility: visible !important;
    opacity: 1 !important;
    position: static !important;
    transform: none !important;
    max-height: none !important;
    width: auto !important;
    background: transparent !important;
  }
  .header .nav__list {
    display: flex !important;
    flex-wrap: wrap !important;
    align-items: center !important;
    gap: 16px !important;
  }
  .header .nav__link { display: inline-block !important; white-space: nowrap !important; }
</style>
</head>
<body>
    <header class="header">
        <div class="container header__container">
            <a href="../index.html" class="logo"><span class="logo__highlight">MELL</span>DRIVE</a>
                                                <nav class="nav" id="mainNav" style="display:flex; visibility:visible; opacity:1;">
                <ul class="nav__list" style="display:flex; flex-wrap:wrap; gap:16px; list-style:none; margin:0; padding:0; align-items:center;">
                    <li><a href="../index.html" class="nav__link" style="white-space:nowrap;">Главная</a></li>
                    <li><a href="catalog.html" class="nav__link active" style="white-space:nowrap;">Автопарк</a></li>
                    <li><a href="map.html" class="nav__link " style="white-space:nowrap;">Карта зон</a></li>
                    <li><a href="profile.html" class="nav__link " style="white-space:nowrap;">Кабинет</a></li>
                    <li><a href="admin.html" class="nav__link " style="white-space:nowrap;">Админка</a></li>
                    <li><a href="ui-kit.html" class="nav__link " style="white-space:nowrap;">UI-кит</a></li>
                </ul>
            </nav>
            <div class="header__actions">
                <a href="map.html" class="btn btn--outline btn--sm">Карта зон</a>
                <a href="../index.html" class="btn btn--primary btn--sm">На главную</a>
            </div>
        </div>
    </header>

    <main class="section">
        <div class="container">
            <nav class="breadcrumbs" aria-label="Хлебные крошки">
                <a href="../index.html">Главная</a> <span>/</span> <a href="map.html">Карта зон</a> <span>/</span> <span>Автопарк</span>
            </nav>

            <div class="section__header">
                <div>
                    <h1 class="section__title" id="catalogHeading">Каталог автопарка</h1>
                    <p class="section__subtitle">Найдено автомобилей: <strong id="carsCount">0</strong> <span id="zoneBadgeText"></span></p>
                </div>
                <div style="display:flex; gap:8px; flex-wrap:wrap;">
                    <a id="allCarsBtn" href="catalog.html" class="btn btn--outline btn--sm hidden">Показать весь парк</a>
                </div>
            </div>

            <div class="catalog-toolbar">
                <input type="search" id="qInput" placeholder="Поиск по марке или характеристикам...">
                <select id="catFilter"><option value="all">Все классы</option></select>
                <select id="sortFilter">
                    <option value="default">Без сортировки</option>
                    <option value="price-asc">Сначала дешевле (сутки)</option>
                    <option value="price-desc">Сначала дороже (сутки)</option>
                </select>
            </div>

            <div class="cars-grid" id="catalogGrid"></div>
        </div>
    </main>

    <script>
        const STORAGE_KEY = 'melldrive_cms_v2';
        const ZONES_KEY = 'melldrive_zones_v1';

        const DEFAULT_CARS = [
            { id: 1, name: 'Hyundai Solaris', category: 'Эконом', specs: 'АКПП • Бензин • Кондиционер', priceMin: 11.5, priceDay: 2400, img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/4/49/2018_Hyundai_Accent_%28Solaris%29_front_3.13.18.jpg/960px-2018_Hyundai_Accent_%28Solaris%29_front_3.13.18.jpg' },
            { id: 2, name: 'Haval Jolion 4WD', category: 'Комфорт', specs: 'Робот • Полный привод • Камеры 360', priceMin: 15.5, priceDay: 3500, img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/3/34/Haval_Jolion_China_%282%29.jpg/960px-Haval_Jolion_China_%282%29.jpg' },
            { id: 3, name: 'Tesla Model 3', category: 'Электро', specs: 'Автопилот • Запас 490 км • Премиум', priceMin: 25.0, priceDay: 6900, img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/9/91/2019_Tesla_Model_3_Performance_AWD_Red_Front.jpg/960px-2019_Tesla_Model_3_Performance_AWD_Red_Front.jpg' },
            { id: 4, name: 'BMW M5 Competition', category: 'Спорт', specs: 'АКПП • 625 л.с. • 0-100 за 3.3 с', priceMin: 55.0, priceDay: 39000, img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/3/3e/BMW_M5_F90_Competition_IMG_3602.jpg/960px-BMW_M5_F90_Competition_IMG_3602.jpg' },
            { id: 5, name: 'Mercedes-Maybach S 580', category: 'Бизнес', specs: 'АКПП • 503 л.с. • Полный привод', priceMin: 75.0, priceDay: 55000, img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/1/1e/Mercedes-Maybach_S_580_4MATIC_X223_IMG_4266.jpg/960px-Mercedes-Maybach_S_580_4MATIC_X223_IMG_4266.jpg' },
            { id: 6, name: 'Porsche 911 Turbo S', category: 'Спорт', specs: 'PDK • 650 л.с. • 0-100 за 2.7 с', priceMin: 90.0, priceDay: 72000, img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/6/6d/Porsche_911_Turbo_S_%28992%29_%E2%80%93_f_26072021.jpg/960px-Porsche_911_Turbo_S_%28992%29_%E2%80%93_f_26072021.jpg' }
        ];

        const params = new URLSearchParams(window.location.search);
        const zoneParam = params.get('zone');

        let cars = DEFAULT_CARS;
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
                const parsed = JSON.parse(raw);
                if (Array.isArray(parsed.cars) && parsed.cars.length) cars = parsed.cars;
            }
        } catch (e) {}

        let activeZone = null;
        if (zoneParam) {
            try {
                const zones = JSON.parse(localStorage.getItem(ZONES_KEY) || '[]');
                activeZone = zones.find(z => z.id === zoneParam) || null;
            } catch (e) {}
        }

        if (activeZone && Array.isArray(activeZone.cars) && activeZone.cars.length) {
            cars = activeZone.cars;
            document.getElementById('catalogHeading').textContent = `Авто в зоне: ${activeZone.title}`;
            document.getElementById('zoneBadgeText').textContent = `(${activeZone.badge})`;
            document.getElementById('allCarsBtn').classList.remove('hidden');
        }

        const catSel = document.getElementById('catFilter');
        [...new Set(cars.map(c => c.category))].forEach(cat => {
            const o = document.createElement('option');
            o.value = cat;
            o.textContent = cat;
            catSel.appendChild(o);
        });

        function render() {
            const q = document.getElementById('qInput').value.trim().toLowerCase();
            const cat = catSel.value;
            const sort = document.getElementById('sortFilter').value;

            let list = cars.filter(c => (!cat || cat === 'all' || c.category === cat) && (!q || c.name.toLowerCase().includes(q) || c.specs.toLowerCase().includes(q)));
            if (sort === 'price-asc') list.sort((a, b) => a.priceDay - b.priceDay);
            if (sort === 'price-desc') list.sort((a, b) => b.priceDay - a.priceDay);

            document.getElementById('carsCount').textContent = list.length;
            document.getElementById('catalogGrid').innerHTML = list.map(car => {
                const zoneSuffix = activeZone ? `&zone=${activeZone.id}` : '';
                return `
                    <article class="car-card">
                        <div class="car-card__badge">${car.category}</div>
                        <img class="car-card__img" src="${car.img}" alt="${car.name}">
                        <div class="car-card__body">
                            <h3 class="car-card__title">${car.name}</h3>
                            <div class="car-card__specs">${car.specs}</div>
                            <div class="car-card__pricing">
                                <span class="car-card__price">${Number(car.priceMin).toFixed(2)} ₽ / мин</span>
                                <span class="car-card__price-sub">или ${Number(car.priceDay).toLocaleString('ru-RU')} ₽ / сутки</span>
                            </div>
                            <a href="car.html?id=${car.id}${zoneSuffix}" class="btn btn--primary btn--block">Забронировать</a>
                        </div>
                    </article>
                `;
            }).join('');
        }

        document.getElementById('qInput').addEventListener('input', render);
        catSel.addEventListener('change', render);
        document.getElementById('sortFilter').addEventListener('change', render);
        render();
    </script>
<script>
(function() {
    let loggedIn = false;
    try {
        const s = JSON.parse(localStorage.getItem('melldrive_active_session_v1') || 'null');
        loggedIn = Boolean(s && s.loggedIn);
    } catch (e) {}
    if (!loggedIn) {
        document.querySelectorAll('a[href*="profile.html"]').forEach(a => {
            const li = a.closest('li');
            if (li) li.remove();
            else a.remove();
        });
    }
})();
</script>
</body>
</html>
