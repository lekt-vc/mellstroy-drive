<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Автопарк — MELLDRIVE</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <style>
        .catalog-toolbar {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }
        .catalog-toolbar input, .catalog-toolbar select {
            background: var(--bg-card);
            border: 1.5px solid var(--border);
            color: var(--text-main);
            padding: 11px 14px;
            border-radius: 10px;
            font-size: 0.95rem;
            width: 100%;
        }
        .status-tag-busy {
            display: inline-block;
            margin-left: 6px;
            padding: 2px 7px;
            border-radius: 6px;
            background: rgba(239, 68, 68, 0.18);
            color: var(--danger);
            font-size: 0.75rem;
            font-weight: 700;
        }
        @media (max-width: 768px) {
            .catalog-toolbar { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container header__container">
            <a href="../index.html" class="logo"><span class="logo__highlight">MELL</span>DRIVE</a>
            <nav class="nav" id="mainNav">
                <ul class="nav__list">
                    <li><a href="../index.html" class="nav__link">Главная</a></li>
                    <li><a href="catalog.html" class="nav__link active">Автопарк</a></li>
                    <li><a href="map.html" class="nav__link">Карта зон</a></li>
                    <li><a href="profile.html" class="nav__link">Кабинет</a></li>
                    <li><a href="admin.html" class="nav__link">Админка</a></li>
                    <li><a href="ui-kit.html" class="nav__link">UI-кит</a></li>
                </ul>
            </nav>
            <div class="header__actions">
                <button type="button" class="theme-toggle" id="themeToggle" aria-label="Сменить тему">🌙</button>
                <a href="login.html" class="btn btn--primary btn--sm">Войти</a>
            </div>
        </div>
    </header>

    <main class="section">
        <div class="container">
            <div class="section__header">
                <div>
                    <h1 class="section__title" id="catalogHeading">Каталог автопарка</h1>
                    <p class="section__subtitle">Автомобилей в списке: <strong id="carsCount">0</strong> <span id="zoneBadgeText"></span></p>
                </div>
                <a id="allCarsBtn" href="catalog.html" class="btn btn--outline btn--sm hidden">Показать весь парк</a>
            </div>

            <div class="catalog-toolbar">
                <input type="search" id="qInput" placeholder="Поиск по марке, госномеру (можно латиницей) или характеристикам...">
                <select id="catFilter">
                    <option value="all">Все классы (Эконом, Комфорт, Суприм)</option>
                    <option value="Эконом">Эконом</option>
                    <option value="Комфорт">Комфорт</option>
                    <option value="Суприм">Суприм</option>
                </select>
                <select id="sortFilter">
                    <option value="default">Без сортировки</option>
                    <option value="price-asc">Сначала дешевле (минута)</option>
                    <option value="price-desc">Сначала дороже (минута)</option>
                </select>
            </div>

            <div class="cars-grid" id="catalogGrid"></div>
        </div>
    </main>

    <script src="../assets/js/fleet-data.js"></script>
    <script>
        const ZONES_KEY = 'melldrive_zones_v1';
        let cars = window.buildMellFleetUnits(true);

        const params = new URLSearchParams(window.location.search);
        const zoneParam = params.get('zone');
        let activeZone = null;

        if (zoneParam) {
            try {
                const zones = JSON.parse(localStorage.getItem(ZONES_KEY) || '[]');
                activeZone = zones.find(z => z.id === zoneParam) || null;
            } catch (e) {}
        }

        if (activeZone && Array.isArray(activeZone.cars) && activeZone.cars.length) {
            // Синхронизируем актуальные цены из fleet-data по plate
            const byPlate = new Map(cars.map(c => [c.plate, c]));
            cars = activeZone.cars.map(zc => byPlate.get(window.normalizePlate(zc.plate)) || zc);
            document.getElementById('catalogHeading').textContent = `Авто в зоне: ${activeZone.title}`;
            document.getElementById('zoneBadgeText').textContent = `(${activeZone.badge})`;
            document.getElementById('allCarsBtn').classList.remove('hidden');
        }

        function render() {
            const rawQ = document.getElementById('qInput').value.trim();
            const q = rawQ.toLowerCase();
            const qPlate = window.normalizePlate(rawQ);
            const cat = document.getElementById('catFilter').value;
            const sort = document.getElementById('sortFilter').value;

            let list = cars.filter(c =>
                (!cat || cat === 'all' || c.category === cat) &&
                (!q || c.name.toLowerCase().includes(q) || c.specs.toLowerCase().includes(q) || window.normalizePlate(c.plate).includes(qPlate))
            );
            if (sort === 'price-asc') list.sort((a, b) => a.priceMin - b.priceMin);
            if (sort === 'price-desc') list.sort((a, b) => b.priceMin - a.priceMin);

            document.getElementById('carsCount').textContent = list.length;
            document.getElementById('catalogGrid').innerHTML = list.map(car => {
                const zoneSuffix = activeZone ? `&zone=${encodeURIComponent(activeZone.id)}` : '';
                const busy = Boolean(window.getActiveBookingForPlate(car.plate));
                const safeName = window.escapeHtml(car.name);
                const safeCat = window.escapeHtml(car.category);
                const safeSpecs = window.escapeHtml(car.specs);
                const safePlate = window.escapeHtml(car.plate);
                return `
                    <article class="car-card">
                        <div class="car-card__badge">${safeCat} • ${safePlate}</div>
                        <img class="car-card__img" src="${window.escapeHtml(car.img)}" alt="${safeName}" onerror="window.mellCarPlaceholder(this, '${safeName}', '${safeCat}')">
                        <div class="car-card__body">
                            <h3 class="car-card__title">
                                ${safeName} <small style="font-weight:500; color:var(--text-muted); font-size:0.84rem;">(#${car.copyNumber || 1})</small>
                                ${busy ? '<span class="status-tag-busy">В аренде</span>' : ''}
                            </h3>
                            <div class="car-card__specs">${safeSpecs}</div>
                            <div class="car-card__pricing">
                                <span class="car-card__price">${Number(car.priceMin)} ₽ / мин • ${Number(car.priceHour).toLocaleString('ru-RU')} ₽ / час</span>
                                <span class="car-card__price-sub">или ${Number(car.priceDay).toLocaleString('ru-RU')} ₽ / день</span>
                            </div>
                            <a href="car.html?id=${car.id}${zoneSuffix}" class="btn ${busy ? 'btn--outline' : 'btn--primary'} btn--block" style="margin-top:8px;">
                                ${busy ? 'Посмотреть (в аренде)' : 'Забронировать'}
                            </a>
                        </div>
                    </article>
                `;
            }).join('');
        }

        document.getElementById('qInput').addEventListener('input', render);
        document.getElementById('catFilter').addEventListener('change', render);
        document.getElementById('sortFilter').addEventListener('change', render);
        render();
    </script>
    <script src="../assets/js/theme-session.js"></script>
</body>
</html>
