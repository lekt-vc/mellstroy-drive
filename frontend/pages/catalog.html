<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Автопарк (39 авто) — MELLDRIVE</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <style>
        .catalog-toolbar {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }
        .catalog-toolbar input, .catalog-toolbar select {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 11px 14px;
            border-radius: 10px;
            font-size: 0.95rem;
            width: 100%;
        }
        @media (max-width: 768px) {
            .catalog-toolbar { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container header__container">
            <a href="../index.html" class="logo"><span class="logo__highlight">MELL</span>DRIVE</a>
            <nav class="nav" id="mainNav">
                <ul class="nav__list">
                    <li><a href="../index.html" class="nav__link">Главная</a></li>
                    <li><a href="catalog.html" class="nav__link active">Автопарк (39)</a></li>
                    <li><a href="map.html" class="nav__link">Карта зон</a></li>
                    <li><a href="profile.html" class="nav__link">Кабинет</a></li>
                    <li><a href="admin.html" class="nav__link">Админка</a></li>
                    <li><a href="ui-kit.html" class="nav__link">UI-кит</a></li>
                </ul>
            </nav>
            <div class="header__actions">
                <button type="button" class="theme-toggle" id="themeToggle" aria-label="Сменить тему">🌙</button>
                <a href="map.html" class="btn btn--outline btn--sm">Карта зон</a>
            </div>
        </div>
    </header>

    <main class="section">
        <div class="container">
            <div class="section__header">
                <div>
                    <h1 class="section__title" id="catalogHeading">Каталог автопарка</h1>
                    <p class="section__subtitle">Доступно автомобилей: <strong id="carsCount">0</strong> <span id="zoneBadgeText"></span></p>
                </div>
                <a id="allCarsBtn" href="catalog.html" class="btn btn--outline btn--sm hidden">Показать все 39 авто</a>
            </div>

            <div class="catalog-toolbar">
                <input type="search" id="qInput" placeholder="Поиск по марке, госномеру или характеристикам...">
                <select id="catFilter">
                    <option value="all">Все классы (Эконом, Комфорт, Суприм)</option>
                    <option value="Эконом">Эконом</option>
                    <option value="Комфорт">Комфорт</option>
                    <option value="Суприм">Суприм</option>
                </select>
                <select id="sortFilter">
                    <option value="default">Без сортировки</option>
                    <option value="price-asc">Сначала дешевле (минута)</option>
                    <option value="price-desc">Сначала дороже (минута)</option>
                </select>
            </div>

            <div class="cars-grid" id="catalogGrid"></div>
        </div>
    </main>

    <script src="../assets/js/fleet-data.js"></script>
    <script>
        const ZONES_KEY = 'melldrive_zones_v1';
        const STORAGE_KEY = 'melldrive_cms_v2';

        let cars = window.buildMellFleetUnits(true);

        // Добавляем машины, созданные вручную в админке (если есть)
        try {
            const cms = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
            if (Array.isArray(cms.cars)) {
                const extra = cms.cars.filter(c => Number(c.id) > 100);
                extra.forEach(c => {
                    cars.push({
                        ...c,
                        plate: c.plate || `Н${200 + (Number(c.id) % 700)}ММ77`,
                        priceHour: c.priceHour || Math.round((Number(c.priceMin) * 50) / 10) * 10,
                        img: (c.img && c.img.startsWith('assets/')) ? ('../' + c.img) : (c.img || '../assets/img/cars/porsche-911.jpg')
                    });
                });
            }
        } catch (e) {}

        const params = new URLSearchParams(window.location.search);
        const zoneParam = params.get('zone');
        let activeZone = null;

        if (zoneParam) {
            try {
                const zones = JSON.parse(localStorage.getItem(ZONES_KEY) || '[]');
                activeZone = zones.find(z => z.id === zoneParam) || null;
            } catch (e) {}
        }

        if (activeZone && Array.isArray(activeZone.cars) && activeZone.cars.length) {
            cars = activeZone.cars;
            document.getElementById('catalogHeading').textContent = `Авто в зоне: ${activeZone.title}`;
            document.getElementById('zoneBadgeText').textContent = `(${activeZone.badge})`;
            document.getElementById('allCarsBtn').classList.remove('hidden');
        }

        function render() {
            const q = document.getElementById('qInput').value.trim().toLowerCase();
            const cat = document.getElementById('catFilter').value;
            const sort = document.getElementById('sortFilter').value;

            let list = cars.filter(c =>
                (!cat || cat === 'all' || c.category === cat) &&
                (!q || c.name.toLowerCase().includes(q) || c.specs.toLowerCase().includes(q) || (c.plate || '').toLowerCase().includes(q))
            );
            if (sort === 'price-asc') list.sort((a, b) => a.priceMin - b.priceMin);
            if (sort === 'price-desc') list.sort((a, b) => b.priceMin - a.priceMin);

            document.getElementById('carsCount').textContent = list.length;
            document.getElementById('catalogGrid').innerHTML = list.map(car => {
                const zoneSuffix = activeZone ? `&zone=${activeZone.id}` : '';
                const hourPrice = car.priceHour || Math.round((Number(car.priceMin) * 50) / 10) * 10;
                return `
                    <article class="car-card">
                        <div class="car-card__badge">${car.category} • ${car.plate}</div>
                        <img class="car-card__img" src="${car.img}" alt="${car.name}" onerror="window.mellCarPlaceholder(this, '${car.name}', '${car.category}')">
                        <div class="car-card__body">
                            <h3 class="car-card__title">${car.name} <small style="font-weight:500; color:var(--text-muted); font-size:0.85rem;">(бортовой №${car.copyNumber || 1})</small></h3>
                            <div class="car-card__specs">${car.specs}</div>
                            <div class="car-card__pricing">
                                <span class="car-card__price">${Number(car.priceMin)} ₽ / мин • ${Number(hourPrice).toLocaleString('ru-RU')} ₽ / час</span>
                                <span class="car-card__price-sub">или ${Number(car.priceDay).toLocaleString('ru-RU')} ₽ / день</span>
                            </div>
                            <a href="car.html?id=${car.id}${zoneSuffix}" class="btn btn--primary btn--block" style="margin-top:8px;">Забронировать</a>
                        </div>
                    </article>
                `;
            }).join('');
        }

        document.getElementById('qInput').addEventListener('input', render);
        document.getElementById('catFilter').addEventListener('change', render);
        document.getElementById('sortFilter').addEventListener('change', render);
        render();
    </script>
    <script src="../assets/js/theme-session.js"></script>
</body>
</html>
