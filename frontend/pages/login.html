<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — MELLDRIVE</title>
    <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body style="display:flex; min-height:100vh; align-items:center; justify-content:center; padding:20px;">
    <div style="width:100%; max-width:430px; background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:28px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
            <a href="../index.html" class="logo"><span class="logo__highlight">MELL</span>DRIVE</a>
            <button type="button" class="theme-toggle" id="themeToggle" aria-label="Сменить тему">🌙</button>
        </div>
        <h1 style="font-size:1.5rem; margin-bottom:12px; text-align:center;">Вход в аккаунт</h1>
        <p id="regNotice" class="hidden" style="margin-bottom:14px; padding:10px 12px; border-radius:8px; background:rgba(34,197,94,0.14); color:var(--success); font-size:0.86rem; text-align:center;">
            Аккаунт зарегистрирован. Введите пароль для входа.
        </p>
        <form id="loginForm" style="display:grid; gap:14px;">
            <label>E-mail или телефон
                <input type="text" id="loginIdentity" required placeholder="Введите e-mail или телефон" style="width:100%; margin-top:6px; padding:10px 12px; border-radius:8px; background:var(--bg-main); color:var(--text-main); border:1px solid var(--border);">
            </label>
            <label>Пароль
                <input type="password" id="loginPassword" required placeholder="••••••••" style="width:100%; margin-top:6px; padding:10px 12px; border-radius:8px; background:var(--bg-main); color:var(--text-main); border:1px solid var(--border);">
            </label>
            <p id="loginError" class="hidden" style="color:var(--danger); font-size:0.88rem;"></p>
            <button type="submit" class="btn btn--primary btn--block">Войти</button>
        </form>
        <p style="margin-top:16px; font-size:0.9rem; color:var(--text-muted); text-align:center;">
            Нет аккаунта? <a href="register.html" style="color:var(--gold);">Регистрация</a>
        </p>
    </div>
    <script>
        const DB_KEY = 'melldrive_accounts_db_v1';
        const SESSION_KEY = 'melldrive_active_session_v1';
        const ADMIN_SESSION_KEY = 'melldrive_admin_session_v1';

        function loadAccountsDb() {
            try {
                const raw = localStorage.getItem(DB_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed)) return parsed;
                }
            } catch (e) {}
            return [];
        }

        const params = new URLSearchParams(window.location.search);
        if (params.get('registered') === '1') {
            document.getElementById('regNotice').classList.remove('hidden');
            const em = params.get('email');
            if (em) document.getElementById('loginIdentity').value = em;
        }

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const idVal = document.getElementById('loginIdentity').value.trim().toLowerCase();
            const idDigits = idVal.replace(/\D/g, '');
            const pwdVal = document.getElementById('loginPassword').value;
            const errEl = document.getElementById('loginError');

            if (idVal === 'admin@melldrive.ru' && pwdVal === 'admin123') {
                errEl.classList.add('hidden');
                localStorage.setItem(ADMIN_SESSION_KEY, JSON.stringify({ isAdmin: true, login: idVal }));
                window.location.href = 'admin.html';
                return;
            }

            const db = loadAccountsDb();
            const matched = db.find(acc => {
                const emailMatch = acc.email && acc.email.toLowerCase() === idVal;
                const phoneMatch = idDigits.length >= 10 && acc.phone && acc.phone.replace(/\D/g, '') === idDigits;
                return (emailMatch || phoneMatch) && acc.password === pwdVal;
            });

            if (!matched) {
                errEl.textContent = 'Аккаунт не найден или пароль неверный. Сначала зарегистрируйтесь.';
                errEl.classList.remove('hidden');
                return;
            }

            errEl.classList.add('hidden');
            localStorage.setItem(SESSION_KEY, JSON.stringify({
                loggedIn: true,
                accountId: matched.id,
                name: matched.name,
                email: matched.email,
                phone: matched.phone,
                license: matched.license,
                licenseConfirmed: matched.licenseConfirmed
            }));
            document.cookie = `melldrive_account_cookie=${encodeURIComponent(JSON.stringify({ email: matched.email, name: matched.name, license: matched.license }))}; path=/; max-age=${14 * 86400}; SameSite=Lax`;
            window.location.href = 'profile.html';
        });
    </script>
    <script src="../assets/js/theme-session.js"></script>
</body>
</html>
