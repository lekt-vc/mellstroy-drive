<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — MELLDRIVE</title>
    <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body style="display:flex; min-height:100vh; align-items:center; justify-content:center; padding:20px;">
    <div style="width:100%; max-width:420px; background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:28px;">
        <a href="../index.html" class="logo" style="justify-content:center; margin-bottom:18px;"><span class="logo__highlight">MELL</span>DRIVE</a>
        <h1 style="font-size:1.5rem; margin-bottom:12px; text-align:center;">Вход в аккаунт</h1>
        <p id="regNotice" class="hidden" style="margin-bottom:14px; padding:10px 12px; border-radius:8px; background:rgba(34,197,94,0.14); color:var(--success); font-size:0.86rem; text-align:center;">
            Аккаунт создан! Войдите под указанными данными.
        </p>
        <form id="loginForm" style="display:grid; gap:14px;">
            <label>E-mail или телефон
                <input type="text" id="loginIdentity" required placeholder="driver@melldrive.ru или +79991234567" style="width:100%; margin-top:6px; padding:10px 12px; border-radius:8px; background:var(--bg-main); color:var(--text-main); border:1px solid var(--border);">
            </label>
            <label>Пароль
                <input type="password" id="loginPassword" required placeholder="••••••••" style="width:100%; margin-top:6px; padding:10px 12px; border-radius:8px; background:var(--bg-main); color:var(--text-main); border:1px solid var(--border);">
            </label>
            <button type="submit" class="btn btn--primary btn--block">Войти</button>
        </form>
        <p style="margin-top:16px; font-size:0.9rem; color:var(--text-muted); text-align:center;">
            Нет аккаунта? <a href="register.html" style="color:var(--gold);">Регистрация</a> • <a href="profile.html" style="color:var(--gold);">Кабинет</a>
        </p>
    </div>
    <script>
        const ACCOUNT_KEY = 'melldrive_user_account_v1';
        const params = new URLSearchParams(window.location.search);
        let acc = null;
        try { acc = JSON.parse(localStorage.getItem(ACCOUNT_KEY) || 'null'); } catch (e) {}

        if (params.get('registered') === '1') {
            document.getElementById('regNotice').classList.remove('hidden');
            if (acc && acc.email) {
                document.getElementById('loginIdentity').value = acc.email;
            }
        }

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const idVal = document.getElementById('loginIdentity').value.trim();
            const updated = {
                name: acc?.name || 'Водитель MELLDRIVE',
                email: idVal.includes('@') ? idVal : (acc?.email || 'driver@melldrive.ru'),
                phone: !idVal.includes('@') ? idVal : (acc?.phone || '+7 (999) 000-00-00'),
                license: acc?.license || '9901123456',
                loggedIn: true
            };
            localStorage.setItem(ACCOUNT_KEY, JSON.stringify(updated));
            window.location.href = 'profile.html';
        });
    </script>
</body>
</html>
