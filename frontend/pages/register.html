<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — MELLDRIVE</title>
    <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body style="display:flex; min-height:100vh; align-items:center; justify-content:center; padding:20px;">
    <div style="width:100%; max-width:500px; background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:28px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
            <a href="../index.html" class="logo"><span class="logo__highlight">MELL</span>DRIVE</a>
            <button type="button" class="theme-toggle" id="themeToggle" aria-label="Сменить тему">🌙</button>
        </div>
        <h1 style="font-size:1.5rem; margin-bottom:16px; text-align:center;">Регистрация водителя</h1>
        <form id="regForm" style="display:grid; gap:13px;">
            <label>Имя и фамилия (обязательно оба поля через пробел)
                <input type="text" id="fullName" required placeholder="Иван Смирнов" style="width:100%; margin-top:6px; padding:10px 12px; border-radius:8px; background:var(--bg-main); color:var(--text-main); border:1px solid var(--border);">
            </label>
            <label>Электронная почта (E-mail)
                <input type="email" id="regEmail" required placeholder="driver@example.com" style="width:100%; margin-top:6px; padding:10px 12px; border-radius:8px; background:var(--bg-main); color:var(--text-main); border:1px solid var(--border);">
            </label>
            <label>Номер телефона
                <input type="tel" id="regPhone" required placeholder="+7 (999) 123-45-67" style="width:100%; margin-top:6px; padding:10px 12px; border-radius:8px; background:var(--bg-main); color:var(--text-main); border:1px solid var(--border);">
            </label>
            <label>Пароль (не менее 6 символов)
                <input type="password" id="regPassword" minlength="6" required placeholder="••••••••" style="width:100%; margin-top:6px; padding:10px 12px; border-radius:8px; background:var(--bg-main); color:var(--text-main); border:1px solid var(--border);">
            </label>
            <label>Повторите пароль
                <input type="password" id="regPasswordRepeat" minlength="6" required placeholder="••••••••" style="width:100%; margin-top:6px; padding:10px 12px; border-radius:8px; background:var(--bg-main); color:var(--text-main); border:1px solid var(--border);">
            </label>
            <label>Дата рождения (от 18 лет)
                <input type="date" id="birthDate" required style="width:100%; margin-top:6px; padding:10px 12px; border-radius:8px; background:var(--bg-main); color:var(--text-main); border:1px solid var(--border);">
            </label>
            <label>Серия и номер ВУ (строго 10 цифр)
                <input type="text" id="driverLicense" inputmode="numeric" maxlength="14" required placeholder="9901123456" style="width:100%; margin-top:6px; padding:10px 12px; border-radius:8px; background:var(--bg-main); color:var(--text-main); border:1px solid var(--border);">
            </label>
            <label style="display:flex; gap:8px; align-items:flex-start; font-size:0.86rem; color:var(--text-muted); cursor:pointer;">
                <input type="checkbox" id="confirmLicenseCb" required style="margin-top:3px;">
                <span>Подтверждаю корректность серии и номера водительского удостоверения и согласие на проверку данных.</span>
            </label>
            <p id="regError" class="hidden" style="color:var(--danger); font-size:0.88rem;"></p>
            <button type="submit" class="btn btn--primary btn--block">Создать аккаунт</button>
        </form>
        <p style="margin-top:16px; font-size:0.9rem; color:var(--text-muted); text-align:center;">
            Уже есть профиль? <a href="login.html" style="color:var(--gold);">Войти</a>
        </p>
    </div>
    <script>
        const DB_KEY = 'melldrive_accounts_db_v1';
        const SESSION_KEY = 'melldrive_active_session_v1';

        function loadAccountsDb() {
            try {
                const raw = localStorage.getItem(DB_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed)) return parsed;
                }
            } catch (e) {}
            return [];
        }

        document.getElementById('regForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const fullName = document.getElementById('fullName').value.trim();
            const nameParts = fullName.split(/\s+/).filter(Boolean);
            const email = document.getElementById('regEmail').value.trim().toLowerCase();
            const phone = document.getElementById('regPhone').value.trim();
            const phoneDigits = phone.replace(/\D/g, '');
            const password = document.getElementById('regPassword').value;
            const passwordRepeat = document.getElementById('regPasswordRepeat').value;
            const val = document.getElementById('birthDate').value;
            const digitsOnly = document.getElementById('driverLicense').value.replace(/\D/g, '');
            const licenseConfirmed = document.getElementById('confirmLicenseCb').checked;
            const err = document.getElementById('regError');

            if (nameParts.length < 2 || nameParts.some(p => p.length < 2)) {
                err.textContent = 'Укажите и имя, и фамилию (минимум два слова через пробел).';
                err.classList.remove('hidden');
                return;
            }
            if (!email || !email.includes('@')) {
                err.textContent = 'Введите корректный адрес электронной почты.';
                err.classList.remove('hidden');
                return;
            }
            if (phoneDigits.length < 10) {
                err.textContent = 'Введите корректный номер телефона (минимум 10 цифр).';
                err.classList.remove('hidden');
                return;
            }
            if (password.length < 6) {
                err.textContent = 'Пароль должен содержать не менее 6 символов.';
                err.classList.remove('hidden');
                return;
            }
            if (password !== passwordRepeat) {
                err.textContent = 'Пароли не совпадают. Проверьте поле «Повторите пароль».';
                err.classList.remove('hidden');
                return;
            }
            if (!val) return;
            const birth = new Date(val);
            const age = (Date.now() - birth.getTime()) / (1000 * 60 * 60 * 24 * 365.25);
            if (age < 18) {
                err.textContent = 'Регистрация доступна только с 18 лет.';
                err.classList.remove('hidden');
                return;
            }
            if (digitsOnly.length !== 10) {
                err.textContent = 'Серия и номер водительского удостоверения должны содержать ровно 10 цифр.';
                err.classList.remove('hidden');
                return;
            }
            if (!licenseConfirmed) {
                err.textContent = 'Необходимо подтвердить номер водительского удостоверения.';
                err.classList.remove('hidden');
                return;
            }

            const db = loadAccountsDb();
            const exists = db.some(acc => acc.email === email || acc.phone.replace(/\D/g, '') === phoneDigits);
            if (exists) {
                err.textContent = 'Аккаунт с таким E-mail или телефоном уже существует в локальной базе.';
                err.classList.remove('hidden');
                return;
            }

            const newAccount = {
                id: Date.now(),
                name: fullName,
                email,
                phone,
                password,
                license: digitsOnly,
                licenseConfirmed: true
            };
            db.push(newAccount);
            localStorage.setItem(DB_KEY, JSON.stringify(db));
            localStorage.removeItem(SESSION_KEY);

            err.classList.add('hidden');
            window.location.href = 'login.html?registered=1&email=' + encodeURIComponent(email);
        });
    </script>
    <script src="../assets/js/theme-session.js"></script>
</body>
</html>
